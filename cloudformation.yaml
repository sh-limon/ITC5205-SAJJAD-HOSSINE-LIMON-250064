#!/usr/bin/env bash
set -euo pipefail

REGION="${AWS_REGION:-ap-southeast-2}"
STACK_NAME="${STACK_NAME:-itc5205-yolov5-20036047}"
BUCKET_NAME="${BUCKET_NAME:-itc5205-yolov5-demo-20036047}"
ECR_REPO="${ECR_REPO:-itc5205-yolov5-lambda-20036047}"
API_KEY_VALUE="${API_KEY_VALUE:-$(openssl rand -hex 24)}"
ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
IMAGE_URI="$ACCOUNT_ID.dkr.ecr.$REGION.amazonaws.com/$ECR_REPO:latest"

aws ecr describe-repositories --repository-names "$ECR_REPO" --region "$REGION" >/dev/null 2>&1 || \
  aws ecr create-repository --repository-name "$ECR_REPO" --region "$REGION" >/dev/null

aws ecr get-login-password --region "$REGION" | docker login --username AWS --password-stdin "$ACCOUNT_ID.dkr.ecr.$REGION.amazonaws.com"
docker build -t "$ECR_REPO:latest" -f deploy/Dockerfile .
docker tag "$ECR_REPO:latest" "$IMAGE_URI"
docker push "$IMAGE_URI"

aws cloudformation deploy \
  --template-file deploy/cloudformation.yaml \
  --stack-name "$STACK_NAME" \
  --capabilities CAPABILITY_NAMED_IAM \
  --region "$REGION" \
  --parameter-overrides BucketName="$BUCKET_NAME" LambdaImageUri="$IMAGE_URI" ApiKeyValue="$API_KEY_VALUE"

echo ""
echo "CloudFormation outputs:"
aws cloudformation describe-stacks \
  --stack-name "$STACK_NAME" \
  --region "$REGION" \
  --query "Stacks[0].Outputs"

echo ""
echo "Use this API key when testing. Keep it private and paste it only into local test commands, not the public report:"
echo "$API_KEY_VALUE"
